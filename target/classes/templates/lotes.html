<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Lotes - Ferretería Artola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #cbd5e1; padding: 8px 12px; font-size: 0.9rem; }
        .form-control:disabled, .form-select:disabled { background-color: #e2e8f0; opacity: 1; }
        .table thead { background-color: #0f172a; color: white; }
        .btn-custom-primary { background-color: #0f172a; color: #fff; border-radius: 8px; }
        .btn-custom-primary:hover { background-color: #1e293b; color: #fff; }
        .btn-custom-warning { background-color: #d97706; color: #fff; border-radius: 8px; }
        .btn-custom-warning:hover { background-color: #b45309; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">📦 Ferretería Artola - Módulo de Lotes de Producto</span>
        <div class="d-flex gap-2">
            <a href="/compras" class="btn btn-outline-light btn-sm px-3 fw-semibold">🛒 Compras</a>
            <a href="/home" class="btn btn-outline-light btn-sm px-3 fw-semibold">🏠 Panel Principal</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Barra de Acciones Principales -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark m-0">Control de Lotes</h4>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-custom-primary px-4 fw-semibold shadow-sm" onclick="habilitarModoNuevo()">
                ➕ Nuevo Lote
            </button>
            <button type="button" class="btn btn-custom-warning px-4 fw-semibold shadow-sm" onclick="habilitarModoModificar()">
                ✏️ Modificar
            </button>
        </div>
    </div>

    <!-- Formulario -->
    <div class="card card-modern p-4 mb-4 bg-white">
        <div class="pb-3 mb-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-bold text-dark m-0" id="tituloFormulario">Formulario de Lote (Bloqueado)</h5>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="limpiarYBloquearFormulario()">Cancelar / Bloquear</button>
        </div>

        <form th:action="@{/lotes/guardar}" th:object="${lote}" method="post" class="row g-3" id="loteForm">
            <input type="hidden" th:field="*{IdLoteProducto}" id="IdLoteProducto">
            <input type="hidden" th:field="*{Estado}" id="Estado">

            <div class="col-md-3">
                <label class="form-label">Código de Barra Lote</label>
                <input type="text" th:field="*{CodigoBarra}" id="CodigoBarra" maxlength="10" class="form-control text-uppercase" required disabled placeholder="LOT-0001">
            </div>

            <div class="col-md-5">
                <label class="form-label">Producto</label>
                <select th:field="*{producto.IdProducto}" id="Producto" class="form-select" required disabled>
                    <option value="">Seleccione producto...</option>
                    <option th:each="p : ${productos}" th:value="${p.IdProducto}" th:text="${p.Nombre}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Proveedor</label>
                <select th:field="*{proveedor.IdProveedor}" id="Proveedor" class="form-select" required disabled>
                    <option value="">Seleccione proveedor...</option>
                    <option th:each="prov : ${proveedores}" th:value="${prov.IdProveedor}" th:text="${prov.RazonSocial}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Usuario Responsable</label>
                <select th:field="*{usuario.IdUsuario}" id="Usuario" class="form-select" required disabled>
                    <option value="">Seleccione usuario...</option>
                    <option th:each="u : ${usuarios}" th:value="${u.IdUsuario}" th:text="${u.Nombres + ' ' + u.Apellidos}"></option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">Cant. Inicial</label>
                <input type="number" th:field="*{CantidadInicial}" id="CantidadInicial" min="1" class="form-control" required disabled placeholder="0">
            </div>

            <div class="col-md-2">
                <label class="form-label">Stock Actual</label>
                <input type="number" th:field="*{StockActual}" id="StockActual" min="0" class="form-control" required disabled placeholder="0">
            </div>

            <div class="col-md-2">
                <label class="form-label">Precio Compra ($)</label>
                <input type="number" step="0.01" th:field="*{PrecioCompra}" id="PrecioCompra" min="0" class="form-control" required disabled placeholder="0.00">
            </div>

            <div class="col-md-2">
                <label class="form-label">Precio Venta ($)</label>
                <input type="number" step="0.01" th:field="*{PrecioVenta}" id="PrecioVenta" min="0" class="form-control" required disabled placeholder="0.00">
            </div>

            <div class="col-md-3">
                <label class="form-label">¿Tiene Vencimiento?</label>
                <select th:field="*{TieneVencimiento}" id="TieneVencimiento" class="form-select" required disabled onchange="toggleVencimiento()">
                    <option value="false">No</option>
                    <option value="true">Sí</option>
                </select>
            </div>

            <div class="col-md-3" id="divFechaVencimiento" style="display: none;">
                <label class="form-label">Fecha de Vencimiento</label>
                <input type="date" th:field="*{FechaVencimiento}" id="FechaVencimiento" class="form-control" disabled>
            </div>

            <div class="col-md-12 d-flex justify-content-end">
                <button type="submit" id="btnGuardar" class="btn btn-success px-5 fw-semibold shadow-sm" disabled>💾 Guardar / Actualizar</button>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div class="card card-modern p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-3">
            <h5 class="fw-bold text-dark m-0">Lotes Registrados</h5>
            <div class="input-group" style="width: 300px;">
                <span class="input-group-text bg-white">🔍</span>
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar lote..." onkeyup="filtrarTabla()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaLotes">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Código Lote</th>
                    <th>Producto</th>
                    <th>Proveedor</th>
                    <th>Stock / Inicial</th>
                    <th>P. Compra / Venta</th>
                    <th>Vencimiento</th>
                    <th>Seleccionar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(lotes)}">
                    <td colspan="8" class="text-center py-4 text-muted">No hay lotes registrados en la base de datos.</td>
                </tr>
                <tr th:each="l : ${lotes}">
                    <td class="fw-semibold text-primary" th:text="${l.IdLoteProducto}"></td>
                    <td><span class="badge bg-dark" th:text="${l.CodigoBarra}"></span></td>
                    <td class="fw-bold" th:text="${l.producto != null ? l.producto.Nombre : 'N/A'}"></td>
                    <td th:text="${l.proveedor != null ? l.proveedor.RazonSocial : 'N/A'}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${l.StockActual + ' / ' + l.CantidadInicial}"></span></td>
                    <td th:text="${'$' + l.PrecioCompra + ' / $' + l.PrecioVenta}"></td>
                    <td>
                        <span th:if="${l.TieneVencimiento}" class="text-danger fw-semibold" th:text="${#dates.format(l.FechaVencimiento, 'dd/MM/yyyy')}"></span>
                        <span th:unless="${l.TieneVencimiento}" class="text-muted">N/A</span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-outline-primary btn-sm px-3" th:onclick="'window.location.href=\'/lotes/editar/' + ${l.IdLoteProducto} + '\''">Seleccionar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('CodigoBarra').addEventListener('input', function (e) {
        e.target.value = e.target.value.toUpperCase();
    });

    function toggleVencimiento() {
        const tieneVenc = document.getElementById('TieneVencimiento').value;
        const divFecha = document.getElementById('divFechaVencimiento');
        const inputFecha = document.getElementById('FechaVencimiento');
        if (tieneVenc === 'true') {
            divFecha.style.display = 'block';
            inputFecha.disabled = false;
        } else {
            divFecha.style.display = 'none';
            inputFecha.value = '';
            inputFecha.disabled = true;
        }
    }

    function habilitarModoNuevo() {
        document.querySelectorAll('#loteForm input, #loteForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = false;
        });
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Registrar Nuevo Lote';
        document.getElementById('IdLoteProducto').value = '';
        document.getElementById('Estado').value = 'true';
        document.getElementById('loteForm').reset();
        toggleVencimiento();
    }

    function habilitarModoModificar() {
        if (!document.getElementById('IdLoteProducto').value) {
            alert('Por favor, seleccione un lote de la tabla haciendo clic en "Seleccionar" para poder modificarlo.');
            return;
        }
        document.querySelectorAll('#loteForm input, #loteForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = false;
        });
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Modificar Lote Seleccionado';
        toggleVencimiento();
    }

    function limpiarYBloquearFormulario() {
        document.querySelectorAll('#loteForm input, #loteForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = true;
        });
        document.getElementById('btnGuardar').disabled = true;
        document.getElementById('tituloFormulario').textContent = 'Formulario de Lote (Bloqueado)';
        document.getElementById('loteForm').reset();
        document.getElementById('divFechaVencimiento').style.display = 'none';
    }

    function filtrarTabla() {
        const filtro = document.getElementById('inputBuscar').value.toLowerCase();
        document.querySelectorAll('#tablaLotes tbody tr').forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
        });
    }

    window.onload = function() {
        if (document.getElementById('IdLoteProducto').value) {
            document.getElementById('tituloFormulario').textContent = 'Lote Seleccionado (Presione "Modificar" arriba para editar)';
            toggleVencimiento();
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
