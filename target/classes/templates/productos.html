<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - Ferretería Artola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #cbd5e1; padding: 8px 12px; font-size: 0.9rem; }
        .form-control:disabled, .form-select:disabled { background-color: #e2e8f0; opacity: 1; }
        .table thead { background-color: #0f172a; color: white; }
        .btn-custom-primary { background-color: #0f172a; color: #fff; border-radius: 8px; }
        .btn-custom-primary:hover { background-color: #1e293b; color: #fff; }
        .btn-custom-warning { background-color: #d97706; color: #fff; border-radius: 8px; }
        .btn-custom-warning:hover { background-color: #b45309; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">🛠️ Ferretería Artola - Catálogo de Productos</span>
        <div class="d-flex gap-2">
            <a href="/proveedores" class="btn btn-outline-light btn-sm px-3 fw-semibold">🏭 Proveedores</a>
            <a href="/home" class="btn btn-outline-light btn-sm px-3 fw-semibold">🏠 Panel Principal</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Barra de Acciones Principales -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark m-0">Inventario de Productos</h4>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-custom-primary px-4 fw-semibold shadow-sm" onclick="habilitarModoNuevo()">
                ➕ Nuevo Producto
            </button>
            <button type="button" class="btn btn-custom-warning px-4 fw-semibold shadow-sm" onclick="habilitarModoModificar()">
                ✏️ Modificar
            </button>
        </div>
    </div>

    <!-- Formulario -->
    <div class="card card-modern p-4 mb-4 bg-white">
        <div class="pb-3 mb-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-bold text-dark m-0" id="tituloFormulario">Formulario de Producto (Bloqueado)</h5>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="limpiarYBloquearFormulario()">Cancelar / Bloquear</button>
        </div>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="row g-3" id="productoForm">
            <input type="hidden" th:field="*{IdProducto}" id="IdProducto">
            <input type="hidden" th:field="*{Estado}" id="Estado">

            <div class="col-md-3">
                <label class="form-label">Código de Barra (Máx 10)</label>
                <input type="text" th:field="*{CodigoBarra}" id="CodigoBarra" maxlength="10" class="form-control text-uppercase" required disabled placeholder="Ej: FER-0001">
            </div>

            <div class="col-md-5">
                <label class="form-label">Nombre del Producto</label>
                <input type="text" th:field="*{Nombre}" id="Nombre" maxlength="50" class="form-control" required disabled placeholder="Ej: Martillo de uña 16 oz">
            </div>

            <div class="col-md-4">
                <label class="form-label">Categoría</label>
                <select th:field="*{categoriaProducto.IdCategoriaProducto}" id="Categoria" class="form-select" required disabled>
                    <option value="">Seleccione una categoría...</option>
                    <option th:each="c : ${categorias}" th:value="${c.IdCategoriaProducto}" th:text="${c.Nombre}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Unidad de Medida (Opcional)</label>
                <select th:field="*{unidadMedida.IdUnidadMedida}" id="UnidadMedida" class="form-select" disabled>
                    <option value="">Sin unidad específica...</option>
                    <option th:each="u : ${unidades}" th:value="${u.IdUnidadMedida}" th:text="${u.Nombre}"></option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">Stock Inicial</label>
                <input type="number" th:field="*{Stock}" id="Stock" min="0" class="form-control" required disabled placeholder="0">
            </div>

            <div class="col-md-6">
                <label class="form-label">Descripción (Opcional)</label>
                <input type="text" th:field="*{Descripcion}" id="Descripcion" maxlength="100" class="form-control" disabled placeholder="Especificaciones del producto">
            </div>

            <div class="col-md-12 d-flex justify-content-end">
                <button type="submit" id="btnGuardar" class="btn btn-success px-5 fw-semibold shadow-sm" disabled>💾 Guardar / Actualizar</button>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div class="card card-modern p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-3">
            <h5 class="fw-bold text-dark m-0">Productos Registrados (Preservación Histórica)</h5>
            <div class="input-group" style="width: 300px;">
                <span class="input-group-text bg-white">🔍</span>
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por código o nombre..." onkeyup="filtrarTabla()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaProductos">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Código Barra</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Unidad</th>
                    <th>Stock</th>
                    <th>Seleccionar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" class="text-center py-4 text-muted">No hay productos registrados en la base de datos.</td>
                </tr>
                <tr th:each="prod : ${productos}">
                    <td class="fw-semibold text-primary" th:text="${prod.IdProducto}"></td>
                    <td><span class="badge bg-dark" th:text="${prod.CodigoBarra}"></span></td>
                    <td class="fw-bold" th:text="${prod.Nombre}"></td>
                    <td th:text="${prod.categoriaProducto != null ? prod.categoriaProducto.Nombre : 'N/A'}"></td>
                    <td th:text="${prod.unidadMedida != null ? prod.unidadMedida.Nombre : 'N/A'}"></td>
                    <td>
                        <span class="fw-bold" th:text="${prod.Stock}"></span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-outline-primary btn-sm px-3" th:onclick="'window.location.href=\'/productos/editar/' + ${prod.IdProducto} + '\''">Seleccionar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Forzar mayúsculas en Código de Barra
    document.getElementById('CodigoBarra').addEventListener('input', function (e) {
        e.target.value = e.target.value.toUpperCase();
    });

    function habilitarModoNuevo() {
        document.querySelectorAll('#productoForm input, #productoForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = false;
        });
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Registrar Nuevo Producto';
        document.getElementById('IdProducto').value = '';
        document.getElementById('Estado').value = 'true';
        document.getElementById('productoForm').reset();
        document.getElementById('Stock').value = '0';
    }

    function habilitarModoModificar() {
        if (!document.getElementById('IdProducto').value) {
            alert('Por favor, seleccione un producto de la tabla haciendo clic en "Seleccionar" para poder modificarlo.');
            return;
        }
        document.querySelectorAll('#productoForm input, #productoForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = false;
        });
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Modificar Producto Seleccionado';
    }

    function limpiarYBloquearFormulario() {
        document.querySelectorAll('#productoForm input, #productoForm select').forEach(el => {
            if (el.type !== 'hidden') el.disabled = true;
        });
        document.getElementById('btnGuardar').disabled = true;
        document.getElementById('tituloFormulario').textContent = 'Formulario de Producto (Bloqueado)';
        document.getElementById('productoForm').reset();
    }

    function filtrarTabla() {
        const filtro = document.getElementById('inputBuscar').value.toLowerCase();
        document.querySelectorAll('#tablaProductos tbody tr').forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
        });
    }

    window.onload = function() {
        if (document.getElementById('IdProducto').value) {
            document.getElementById('tituloFormulario').textContent = 'Producto Seleccionado (Presione "Modificar" arriba para editar)';
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
