server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=BD_FerreteriaArtola;encrypt=true;trustServerCertificate=true;
spring.datasource.username=ferreteria_user
spring.datasource.password=Admin123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita que Hibernate cambie los nombres de las columnas a snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl