<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Ferretería Artola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
        }
        .btn-login {
            background-color: #0f172a;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #1e293b;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">🛠️ Ferretería Artola</h3>
        <p class="text-muted small">Ingrese sus credenciales para acceder</p>
    </div>

    <!-- Apunta a /login por POST para redirigir al home -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Nombre de Usuario</label>
            <input type="text" name="username" class="form-control" required placeholder="Ej: nixonozuna">
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">Contraseña</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-login w-100 shadow-sm">Ingresar al Sistema</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
