<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidades de Medida - Ferretería Artola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control { border-radius: 8px; border: 1px solid #cbd5e1; padding: 8px 12px; font-size: 0.9rem; }
        .form-control:disabled { background-color: #e2e8f0; opacity: 1; }
        .table thead { background-color: #0f172a; color: white; }
        .btn-custom-primary { background-color: #0f172a; color: #fff; border-radius: 8px; }
        .btn-custom-primary:hover { background-color: #1e293b; color: #fff; }
        .btn-custom-warning { background-color: #d97706; color: #fff; border-radius: 8px; }
        .btn-custom-warning:hover { background-color: #b45309; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">📏 Ferretería Artola - Unidades de Medida</span>
        <div class="d-flex gap-2">
            <a href="/categorias" class="btn btn-outline-light btn-sm px-3 fw-semibold">📦 Categorías</a>
            <a href="/usuarios" class="btn btn-outline-light btn-sm px-3 fw-semibold">👥 Usuarios</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark m-0">Catálogo de Unidades de Medida</h4>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-custom-primary px-4 fw-semibold shadow-sm" onclick="habilitarModoNuevo()">
                ➕ Nueva Unidad
            </button>
            <button type="button" class="btn btn-custom-warning px-4 fw-semibold shadow-sm" onclick="habilitarModoModificar()">
                ✏️ Modificar
            </button>
        </div>
    </div>

    <div class="card card-modern p-4 mb-4 bg-white">
        <div class="pb-3 mb-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-bold text-dark m-0" id="tituloFormulario">Formulario de Unidad de Medida (Bloqueado)</h5>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="limpiarYBloquearFormulario()">Cancelar / Bloquear</button>
        </div>

        <form th:action="@{/unidades/guardar}" th:object="${unidad}" method="post" class="row g-3" id="unidadForm">
            <input type="hidden" th:field="*{IdUnidadMedida}" id="IdUnidadMedida">

            <div class="col-md-8">
                <label class="form-label">Nombre de la Unidad</label>
                <input type="text" th:field="*{Nombre}" id="Nombre" maxlength="50" class="form-control" required disabled placeholder="Ej: Libra, Metro, Unidad, Galón...">
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" id="btnGuardar" class="btn btn-success w-100 fw-semibold shadow-sm" disabled>💾 Guardar / Actualizar</button>
            </div>
        </form>
    </div>

    <div class="card card-modern p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-3">
            <h5 class="fw-bold text-dark m-0">Unidades Registradas</h5>
            <div class="input-group" style="width: 300px;">
                <span class="input-group-text bg-white">🔍</span>
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar unidad..." onkeyup="filtrarTabla()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaUnidades">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Fecha de Registro</th>
                    <th>Seleccionar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(unidades)}">
                    <td colspan="4" class="text-center py-4 text-muted">No hay unidades de medida registradas.</td>
                </tr>
                <tr th:each="u : ${unidades}">
                    <td class="fw-semibold text-primary" th:text="${u.IdUnidadMedida}"></td>
                    <td class="fw-bold" th:text="${u.Nombre}"></td>
                    <td class="text-muted" th:text="${u.FechaRegistro != null ? #dates.format(u.FechaRegistro, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                    <td>
                        <button type="button" class="btn btn-outline-primary btn-sm px-3" th:onclick="'window.location.href=\'/unidades/editar/' + ${u.IdUnidadMedida} + '\''">Seleccionar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function habilitarModoNuevo() {
        document.getElementById('Nombre').disabled = false;
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Registrar Nueva Unidad de Medida';
        document.getElementById('IdUnidadMedida').value = '';
        document.getElementById('unidadForm').reset();
    }

    function habilitarModoModificar() {
        const idVal = document.getElementById('IdUnidadMedida').value;
        if (!idVal) {
            alert('Por favor, seleccione una unidad de la tabla haciendo clic en "Seleccionar" para poder modificarla.');
            return;
        }
        document.getElementById('Nombre').disabled = false;
        document.getElementById('btnGuardar').disabled = false;
        document.getElementById('tituloFormulario').textContent = 'Modificar Unidad Seleccionada';
    }

    function limpiarYBloquearFormulario() {
        document.getElementById('Nombre').disabled = true;
        document.getElementById('btnGuardar').disabled = true;
        document.getElementById('tituloFormulario').textContent = 'Formulario de Unidad de Medida (Bloqueado)';
        document.getElementById('unidadForm').reset();
    }

    function filtrarTabla() {
        const filtro = document.getElementById('inputBuscar').value.toLowerCase();
        document.querySelectorAll('#tablaUnidades tbody tr').forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
        });
    }

    window.onload = function() {
        if (document.getElementById('IdUnidadMedida').value) {
            document.getElementById('tituloFormulario').textContent = 'Unidad Seleccionada (Presione "Modificar" arriba para editar)';
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
